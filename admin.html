<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Nova Loan Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23c9bcff'/%3E%3Cstop offset='.55' stop-color='%23a995f5'/%3E%3Cstop offset='1' stop-color='%2335e875'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Cpath d='M50 14C53 38 62 47 86 50C62 53 53 62 50 86C47 62 38 53 14 50C38 47 47 38 50 14Z' fill='url(%23g)'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#000;--s1:#151515;--s2:#202020;--text:#f5f5f5;--muted:#9a9a9f;--line:#282828;--accent:#2f7bff;--green:#35e875;--red:#ff5b5b;--amber:#f5b942}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{width:min(100%,820px);margin:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:23px;letter-spacing:-.5px;margin:0}
.card{background:var(--s1);border:1px solid #202020;border-radius:22px;padding:17px;margin-bottom:16px}
.title{font-size:17px;font-weight:700;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,select{background:var(--s2);border:1px solid #303030;border-radius:14px;padding:13px;width:100%}
.btn{border:0;border-radius:14px;background:var(--accent);color:#ffffff;font-weight:750;padding:0 16px;min-height:46px}
.btn.ghost{background:var(--s2);color:var(--text);border:1px solid #303030}
.btn.red{background:#3a1616;color:#ff9a9a;border:1px solid #5a2323}
.btn.sm{min-height:38px;font-size:14px}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{border:0;background:#1b1b1b;color:#a8a8ad;border-radius:24px;padding:10px 16px;font-size:15px}
.tab.active{background:var(--accent);color:#14121b;font-weight:700}
.panel{display:none}.panel.on{display:block}
.msg{font-size:13px;margin-top:10px;color:var(--red);line-height:1.45}.msg.ok{color:var(--green)}
.hint{font-size:12px;color:#85858a;line-height:1.5;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{font-size:13px;color:#b5b5ba;line-height:1.7}.kv b{color:#fff}
.photos{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.photos a{display:block;width:100px;height:100px;border-radius:12px;overflow:hidden;border:1px solid #303030;background:#080808}
.photos img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--s2);color:var(--muted)}
.pill.ok{background:#12301f;color:var(--green)}.pill.no{background:#3a1616;color:#ff9a9a}.pill.wait{background:#2a2112;color:var(--amber)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-weight:700}
.coin{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px;background:#111}
.inl{display:flex;gap:8px;align-items:center;margin:0;color:var(--text)}.inl input{width:auto}
.empty{padding:22px;text-align:center;color:#85858a;font-size:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media(min-width:900px){
  .app{width:min(100%,1080px)}
  #kycList,#loanList{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #kycList .card,#loanList .card{margin:0}
  #kycList .empty,#loanList .empty{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="app">

<section id="login" class="card" style="margin-top:50px;max-width:420px;margin-left:auto;margin-right:auto">
  <h1>Admin login</h1>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="go" class="btn" style="width:100%;margin-top:14px">Log in</button>
  <div id="lmsg" class="msg"></div>
</section>

<section id="panel" style="display:none">
  <div class="top"><h1>Nova Loan Admin</h1><button id="out" class="btn ghost sm">Log out</button></div>
  <div class="tabs">
    <button class="tab active" data-p="kyc">Verifications</button>
    <button class="tab" data-p="settings">Settings</button>
    <button class="tab" data-p="loans">Loans</button>
  </div>

  <div id="kyc" class="panel on">
    <div class="row" style="margin-bottom:12px"><select id="kf" style="width:auto"><option value="pending">Waiting for review</option><option value="all">All applicants</option></select></div>
    <div id="kycList"></div>
  </div>

  <div id="settings" class="panel">
    <div class="card">
      <div class="title">Money pool</div>
      <label for="net">Network</label>
      <select id="net"><option value="devnet">Devnet (test, no real money)</option><option value="mainnet">Mainnet (real)</option></select>
      <label for="rpc">RPC URL (optional, e.g. your Helius URL for the same network)</label><input id="rpc" placeholder="https://..." spellcheck="false" autocomplete="off">
      <div class="hint">Users never see any address on this page. The server reads each wallet and tells dashboards how much of each coin is available. Tick only the coins you want to offer.</div>
      <div id="coinBox"></div>
      <div class="row" style="margin-top:14px"><button id="check" class="btn ghost sm">Check what users will see</button></div>
      <div id="chk" class="hint"></div>
    </div>
    <div class="card">
      <div class="title">Loan terms</div>
      <div class="grid">
        <div><label for="cap">Most one borrower can draw (USD)</label><input id="cap" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="col">Collateral (% of the draw)</label><input id="col" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="f1">Fee for 1 month (%)</label><input id="f1" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="f2">Fee for 2 months (%)</label><input id="f2" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="f3">Fee for 3 months (%)</label><input id="f3" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="f6">Fee for 4 to 6 months (%)</label><input id="f6" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="late">Late fee (USD, flat)</label><input id="late" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="lateD">Extra interest per day overdue (%)</label><input id="lateD" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="cBTC">Loan cap: Bitcoin (USD)</label><input id="cBTC" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="cETH">Loan cap: Ethereum (USD)</label><input id="cETH" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="cSOL">Loan cap: Solana (USD)</label><input id="cSOL" type="number" min="0" step="any" inputmode="decimal"></div>
        <div><label for="cUSDC">Loan cap: Tether (USDT) (USD)</label><input id="cUSDC" type="number" min="0" step="any" inputmode="decimal"></div>
      </div>
      <button id="save" class="btn" style="width:100%;margin-top:16px">Save settings</button>
      <div id="smsg" class="msg"></div>
      <div class="hint">Saved settings apply to every user's dashboard within a minute.</div>
    </div>
  </div>

  <div id="loans" class="panel"><div id="loanList"></div></div>
</main>

<script>
const SB_URL="https://djkcnhlstjvozrtfcqse.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqa2NuaGxzdGp2b3pydGZjcXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDc5MDYsImV4cCI6MjEwNjg4MzkwNn0.lS_p3mV4tdFOmcOVZBTIXN52HPDOgDAHhLluxUTdX_s";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=id=>Number($(id).value);
const validAddr=a=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);

async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data.session){$("login").style.display="";$("panel").style.display="none";return}
  const {data:p}=await sb.from("profiles").select("role").eq("id",data.session.user.id).maybeSingle();
  if(!p||p.role!=="admin"){
    $("login").style.display="";$("panel").style.display="none";
    $("lmsg").textContent="This account is not an admin.";await sb.auth.signOut();return;
  }
  $("login").style.display="none";$("panel").style.display="";
  loadKyc();loadSettings();loadLoans();
}
$("go").onclick=async()=>{
  $("lmsg").textContent="";$("go").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  $("go").disabled=false;
  if(error){$("lmsg").textContent="Wrong email or password.";return}
  boot();
};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("out").onclick=()=>sb.auth.signOut().finally(()=>location.reload());
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("on",x.id===b.dataset.p));
});

// ---------- Verifications ----------
$("kf").onchange=loadKyc;
async function loadKyc(){
  const L=$("kycList");L.innerHTML='<div class="empty">Loading…</div>';
  let q=sb.from("kyc").select("*").order("created_at",{ascending:false});
  if($("kf").value==="pending")q=q.eq("status","pending");
  const {data:rows,error}=await q;
  if(error){L.innerHTML='<div class="empty">Could not load verifications.</div>';return}
  const {data:ps}=await sb.from("profiles").select("id,email");
  const em=Object.fromEntries((ps||[]).map(p=>[p.id,p.email]));
  if(!rows.length){L.innerHTML='<div class="empty">Nobody is waiting for review.</div>';return}
  const cards=await Promise.all(rows.map(async k=>{
    let urls=[];
    try{const {data}=await sb.storage.from("kyc").createSignedUrls([k.front_path,k.back_path,k.selfie_path].filter(Boolean),600);urls=(data||[]).map(d=>d.signedUrl)}catch(e){}
    const cls=k.status==="approved"?"ok":k.status==="rejected"?"no":"wait";
    return `<div class="card">
      <div class="head"><span>${esc(k.first_name)} ${esc(k.last_name)}</span><span class="pill ${cls}">${esc(k.status)}</span></div>
      <div class="kv">${esc(em[k.user_id]||"")}<br>Phone: <b>${esc(k.phone)}</b> · Born: <b>${esc(k.date_of_birth)}</b><br>Address: <b>${esc(k.address)}</b><br>Work: <b>${esc(k.occupation)}</b>${k.employer?" at <b>"+esc(k.employer)+"</b>":""}<br>${esc(k.id_type)}: <b>${esc(k.id_number)}</b>${k.reject_reason?"<br>Reason given: "+esc(k.reject_reason):""}</div>
      <div class="photos">${urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="ID photo"></a>`).join("")||"<span class='hint'>No photos</span>"}</div>
      <div class="row"><button class="btn sm" data-a="approve" data-u="${esc(k.user_id)}"${k.status==="approved"?" disabled":""}>Approve</button><button class="btn red sm" data-a="reject" data-u="${esc(k.user_id)}">Reject</button></div>
    </div>`;
  }));
  L.innerHTML=cards.join("");
  L.querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>decide(b.dataset.u,b.dataset.a));
}
async function decide(uid,a){
  let upd={reviewed_at:new Date().toISOString()};
  if(a==="approve"){upd.status="approved";upd.reject_reason=null}
  else{
    const why=prompt("Reason the user will see (for example: your ID photo was blurry):");
    if(!why||!why.trim())return;
    upd.status="rejected";upd.reject_reason=why.trim();
  }
  const {error}=await sb.from("kyc").update(upd).eq("user_id",uid);
  if(error){alert("Could not save. "+error.message);return}
  loadKyc();
}

// ---------- Settings ----------
const SYMS=["SOL","USDC","ETH","BTC"],LABEL={USDC:"USDC (users see it as USDT)",ETH:"Ethereum (Sepolia test network)",BTC:"Bitcoin (testnet)"},lb=s=>LABEL[s]||s;
const KNOWN={devnet:{USDC:"4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU",USDT:""},mainnet:{USDC:"EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",USDT:"Es9vMFrzaCERmJfrF4H2FYD4KCoNyH2Wj5Mi7APWNL5"}};
$("coinBox").innerHTML=SYMS.map(s=>`<div class="coin"><div class="head"><span>${lb(s)}</span><label class="inl"><input type="checkbox" id="on-${s}"> Offer ${s}</label></div>
  <label for="a-${s}">Pool wallet address for ${s}</label><input id="a-${s}" placeholder="${s==='ETH'?'Sepolia address starting with 0x':s==='BTC'?'Bitcoin testnet address (tb1…)':'Solana address that holds the '+s}" spellcheck="false" autocomplete="off">
  ${s!=="USDC"?"":`<label for="m-${s}">${s} token address</label><div class="row"><input id="m-${s}" style="flex:1;min-width:0" placeholder="The ${s} token address" spellcheck="false" autocomplete="off"><button type="button" class="btn ghost sm" data-fill="${s}">Use standard</button></div>`}
  <label for="s-${s}">Fallback balance in ${s} (used only if the wallet cannot be read)</label><input id="s-${s}" type="number" min="0" step="any" inputmode="decimal"></div>`).join("");
document.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{
  const s=b.dataset.fill,v=(KNOWN[$("net").value]||{})[s];
  if(!v){alert("There is no standard "+s+" on devnet. Paste the address of your own test token.");return}
  $("m-"+s).value=v;
});
async function loadSettings(){
  const {data}=await sb.from("settings").select("key,value");
  const g=k=>((data||[]).find(r=>r.key===k)||{}).value||{};
  const l=g("loan"),p=g("pool");
  $("net").value=l.net||"devnet";$("cap").value=l.capUsd??2000;$("col").value=l.colPer100??10;
  $("f1").value=l.fee1??20;$("f2").value=l.fee2??20;$("f3").value=l.fee3??20;$("f6").value=l.fee6??20;$("late").value=l.lateFeeUsd??50;$("lateD").value=l.lateDailyPct??0.5;["BTC","ETH","SOL","USDC"].forEach(k=>$("c"+k).value=(l.caps&&l.caps[k])??2000);
  $("rpc").value=p.rpcUrl||"";
  const coins=Array.isArray(p.coins)?p.coins:(p.address?[{sym:"SOL",address:p.address,mint:"",snapshot:p.snapshot||0,enabled:true}]:[]);
  SYMS.forEach(s=>{const c=coins.find(x=>x.sym===s)||{};
    $("on-"+s).checked=!!c.enabled;$("a-"+s).value=c.address||"";if(s==="USDC")$("m-"+s).value=c.mint||"";$("s-"+s).value=c.snapshot||0});
}
$("save").onclick=async()=>{
  const m=$("smsg");m.className="msg";m.textContent="";
  const ids=["cap","col","f1","f2","f3","f6","late"];
  if(ids.some(i=>!($(i).value!==""&&num(i)>=0))){m.textContent="Numbers must be zero or more.";return}
  const rpc=$("rpc").value.trim();
  if(rpc&&!/^https:\/\//.test(rpc)){m.textContent="The RPC URL must start with https://";return}
  const coins=[];
  for(const s of SYMS){
    const on=$("on-"+s).checked,address=$("a-"+s).value.trim(),mint=s==="USDC"?$("m-"+s).value.trim():"",snap=Number($("s-"+s).value)||0;
    if(on&&!(s==="ETH"?/^0x[0-9a-fA-F]{40}$/.test(address):s==="BTC"?/^(tb1|bc1|[mn2])[a-zA-Z0-9]{24,62}$/.test(address):validAddr(address))){m.textContent="Enter a valid pool wallet address for "+s+", or untick it.";return}
    if(on&&s==="USDC"&&!validAddr(mint)){m.textContent="Enter the "+s+" token address, or untick it.";return}
    coins.push({sym:s,enabled:on,address,mint,snapshot:snap});
  }
  $("save").disabled=true;
  const now=new Date().toISOString();
  const {error}=await sb.from("settings").upsert([
    {key:"loan",value:{net:$("net").value,capUsd:num("cap"),colPer100:num("col"),fee1:num("f1"),fee2:num("f2"),fee3:num("f3"),fee6:num("f6"),lateFeeUsd:num("late"),lateDailyPct:num("lateD"),caps:{BTC:num("cBTC"),ETH:num("cETH"),SOL:num("cSOL"),USDC:num("cUSDC")}},updated_at:now},
    {key:"pool",value:{rpcUrl:rpc,coins},updated_at:now}
  ]);
  $("save").disabled=false;
  if(error){m.textContent="Could not save: "+error.message;return}
  m.className="msg ok";m.textContent="Saved. Every user's dashboard will use these settings.";
};
$("check").onclick=async()=>{
  $("chk").textContent="Checking…";
  try{
    const {data,error}=await sb.functions.invoke("offer");
    if(error)throw error;
    const list=(data.coins||[]).map(c=>c.sym+": "+Number(c.base).toLocaleString(undefined,{maximumFractionDigits:6})+" ("+c.why+(c.err?": "+c.err:"")+(c.note?": "+c.note:"")+")");
    $("chk").textContent=(list.length?"Pool balances users are offered: "+list.join(" · ")+". Save your settings first if you just changed them.":"Nothing is offered yet ("+(data.why||"no coins ticked")+").")+" [network: "+(data.net||"?")+(data.solRpc?", Solana RPC: "+data.solRpc:"")+"]";
  }catch(e){$("chk").textContent="The offer function did not answer. Check that it is deployed and named offer."}
};

// ---------- Loans ----------
async function loadLoans(){
  const L=$("loanList");
  const {data:rows,error}=await sb.from("loans").select("*").order("created_at",{ascending:false}).limit(100);
  if(error){L.innerHTML='<div class="empty">Could not load loans.</div>';return}
  if(!rows.length){L.innerHTML='<div class="empty">No loans yet. Draws will appear here once they are saved on the server (the next stage).</div>';return}
  const {data:ps}=await sb.from("profiles").select("id,email");
  const em=Object.fromEntries((ps||[]).map(p=>[p.id,p.email]));
  L.innerHTML=rows.map(r=>`<div class="card"><div class="head"><span>${esc(em[r.user_id]||r.user_id)}</span><span class="pill ${r.status==="paid"?"ok":"wait"}">${esc(r.status)}</span></div>
    <div class="kv">${new Date(r.created_at).toLocaleString()}<br>Draw: <b>${Number(r.sol).toFixed(4)} SOL</b> · GHS <b>${Number(r.ghs).toFixed(2)}</b> · ${esc(r.months)} month(s)<br>Collateral: GHS <b>${Number(r.collateral_ghs).toFixed(2)}</b> ${r.collateral_paid?"(paid)":"(unpaid)"}<br>Pay out to: <b>${esc(r.payout_network)}</b> · ${esc(r.payout_name)} · ${esc(r.payout_number)}</div>
    ${r.status!=="paid"?`<div class="row" style="margin-top:12px"><button class="btn sm" data-id="${esc(r.id)}">Mark paid out</button></div>`:""}</div>`).join("");
  L.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{
    const {error}=await sb.from("loans").update({status:"paid"}).eq("id",b.dataset.id);
    if(error){alert("Could not save. "+error.message);return}
    loadLoans();
  });
}
boot();
</script>
</body>
</html>
