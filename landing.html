<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Nova Wallet · Create your account</title>
<script>try{if(localStorage.getItem("nova_user"))location.replace("index.html")}catch(e){}</script>
<style>
:root{--bg:#000;--s1:#151515;--s2:#202020;--text:#f5f5f5;--muted:#9a9a9f;--line:#282828;--accent:#a995f5;--green:#35e875;--red:#ff5b5b;--amber:#f5b942}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* animated background */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s ease,visibility .7s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.logoWrap{position:relative;width:132px;height:132px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(169,149,245,.5);opacity:0;transform:scale(.4)}
.logoWrap svg{position:relative;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 22px rgba(169,149,245,.55))}
.star{fill:url(#g);fill-opacity:0;stroke:url(#g);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420}
.word{font-size:30px;font-weight:750;letter-spacing:-.6px;opacity:0;transform:translateY(10px)}
.tag{font-size:14px;color:var(--muted);margin-top:-16px;opacity:0;transform:translateY(8px)}
.bar{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:3px;background:#1b1b1b;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--green));transform:scaleX(0);transform-origin:left}
.skip{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:#5d5d62}

@media(prefers-reduced-motion:no-preference){
  .star{animation:draw 1.5s cubic-bezier(.65,0,.35,1) .25s forwards,fill 1s ease 1.3s forwards,pulse 2.6s ease-in-out 2.2s infinite}
  .ring{animation:ring 2.4s cubic-bezier(.2,.6,.3,1) 1.2s infinite}
  .ring.r2{animation-delay:1.9s}
  .word{animation:rise .8s ease 1.5s forwards}
  .tag{animation:rise .8s ease 1.85s forwards}
  .bar i{animation:load 2.7s cubic-bezier(.4,0,.2,1) .1s forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes ring{0%{opacity:.7;transform:scale(.5)}100%{opacity:0;transform:scale(1.9)}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes load{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.star{stroke-dashoffset:0;fill-opacity:1}.word,.tag{opacity:1;transform:none}.bar i{transform:scaleX(1)}}

/* ---------- main page ---------- */
#main{position:relative;z-index:1;width:min(100%,460px);margin:auto;min-height:100vh;min-height:100dvh;padding:calc(34px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(22px);visibility:hidden}
#main.in{visibility:visible;opacity:1;transform:none;transition:opacity .8s ease .15s,transform .8s cubic-bezier(.2,.7,.2,1) .15s}
.mini{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mini svg{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(169,149,245,.5))}
.mini span{font-size:23px;font-weight:750;letter-spacing:-.5px}
h1{font-size:34px;line-height:1.08;letter-spacing:-1.2px;font-weight:750;margin:0 0 10px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 22px}
.card{background:rgba(21,21,21,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #202020;border-radius:22px;padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px}
.field{margin-bottom:14px}
input{background:var(--s2);border:1px solid #303030;border-radius:14px;padding:14px;width:100%;transition:border-color .2s}
input::placeholder{color:#77777d}
input:focus{border-color:var(--accent)}
input.bad{border-color:var(--red)}
.pw{position:relative}.pw input{padding-right:64px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:10px}
.meter{display:flex;gap:5px;margin-top:9px}
.meter i{flex:1;height:4px;border-radius:4px;background:#2a2a2a;transition:background .25s}
.hint{font-size:12px;color:#85858a;margin-top:7px;line-height:1.45;min-height:17px}
.btn{border:0;border-radius:14px;background:var(--accent);color:#17131f;font-weight:750;padding:0 18px;min-height:50px;width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(23,19,31,.25);border-top-color:#17131f;animation:sp .7s linear infinite;display:none}
.btn.load .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{font-size:13px;margin-top:12px;color:var(--red);line-height:1.45;min-height:1px}
.msg.ok{color:var(--green)}
.fine{font-size:12px;color:#6f6f75;line-height:1.5;text-align:center;margin-top:16px}
.trust{display:flex;justify-content:center;gap:18px;margin-top:20px;font-size:12px;color:#85858a}
.trust span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bcff"/><stop offset=".55" stop-color="#a995f5"/><stop offset="1" stop-color="#35e875"/></linearGradient></defs>
</svg>

<!-- Intro animation -->
<div id="splash" role="img" aria-label="Nova Wallet">
  <div class="logoWrap">
    <div class="ring"></div><div class="ring r2"></div>
    <svg viewBox="0 0 100 100"><path class="star" d="M50 6C54 34 66 46 94 50C66 54 54 66 50 94C46 66 34 54 6 50C34 46 46 34 50 6Z"/></svg>
  </div>
  <div class="word">Nova Wallet</div>
  <div class="tag">Turn crypto into cash</div>
  <div class="bar"><i></i></div>
  <div class="skip">Tap to skip</div>
</div>

<main id="main">
  <div class="mini">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6C54 34 66 46 94 50C66 54 54 66 50 94C46 66 34 54 6 50C34 46 46 34 50 6Z" fill="url(#g)"/></svg>
    <span>Nova Wallet</span>
  </div>
  <h1>Sell your crypto.<br><em>Get paid in cedis.</em></h1>
  <p class="lead">Create your account to deposit, sell and cash out to mobile money or your bank.</p>

  <form id="form" class="card" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@gmail.com" required>
    </div>
    <div class="field">
      <label for="pass">Password</label>
      <div class="pw">
        <input id="pass" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <button type="button" id="eye" class="eye" aria-label="Show password">Show</button>
      </div>
      <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="pwHint" class="hint" role="status"></div>
    </div>
    <button id="go" class="btn" type="submit"><span class="spin"></span><span id="goTxt">Create account</span></button>
    <div id="msg" class="msg" role="status"></div>
    <div class="fine">By creating an account you agree to the Terms of Service and Privacy Policy.</div>
  </form>

  <div class="trust"><span>Fast payouts</span><span>Mobile money</span><span>Secure</span></div>
</main>

<script>
const $=id=>document.getElementById(id);

/* ---------- background: drifting glow + particles ---------- */
(function(){
  const c=$("bg"),x=c.getContext("2d");let w,h,dpr,P=[],t=0;
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
    c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(70,w*h/16000));
    P=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,v:Math.random()*.25+.06,a:Math.random()*Math.PI*2,g:Math.random()<.2}));
  }
  function orb(cx,cy,r,col,al){
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,col.replace("A",al));g.addColorStop(1,col.replace("A",0));
    x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);
  }
  function frame(){
    t+=.004;x.clearRect(0,0,w,h);
    const R=Math.max(w,h)*.7;
    orb(w*.5+Math.sin(t*1.3)*w*.22,h*.28+Math.cos(t)*h*.08,R*.8,"rgba(169,149,245,A)",.2);
    orb(w*.8+Math.cos(t*.9)*w*.18,h*.85+Math.sin(t*1.1)*h*.07,R*.7,"rgba(53,232,117,A)",.08);
    for(const p of P){
      p.y-=p.v;p.a+=.02;if(p.y<-4){p.y=h+4;p.x=Math.random()*w}
      const al=.25+.35*Math.sin(p.a)**2;
      x.beginPath();x.arc(p.x+Math.sin(p.a*.5)*6,p.y,p.r,0,6.283);
      x.fillStyle=p.g?`rgba(53,232,117,${al})`:`rgba(190,175,255,${al})`;x.fill();
    }
    if(!still)requestAnimationFrame(frame);
  }
  addEventListener("resize",size);size();frame();
})();

/* ---------- splash -> page ---------- */
const splash=$("splash"),main=$("main");
let shown=false;
function enter(){
  if(shown)return;shown=true;
  splash.classList.add("out");main.classList.add("in");
  setTimeout(()=>{splash.style.display="none"},800);
}
splash.addEventListener("click",enter);
setTimeout(enter,matchMedia("(prefers-reduced-motion:reduce)").matches?300:3000);

/* ---------- form ---------- */
const email=$("email"),pass=$("pass"),go=$("go"),msg=$("msg"),bars=document.querySelectorAll(".meter i");
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function score(v){
  let s=0;if(v.length>=8)s++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v)||v.length>=14)s++;
  return s;
}
const COL=["#2a2a2a",var_("red"),var_("amber"),"#c9d65a",var_("green")];
function var_(n){return getComputedStyle(document.documentElement).getPropertyValue("--"+n).trim()}
pass.addEventListener("input",()=>{
  const v=pass.value,s=v?score(v):0;
  bars.forEach((b,i)=>b.style.background=i<s?COL[s]:"#2a2a2a");
  $("pwHint").textContent=!v?"":v.length<8?"Use at least 8 characters.":!(/[A-Za-z]/.test(v)&&/\d/.test(v))?"Add a letter and a number.":["","Weak","Okay","Good","Strong"][s]+" password";
  pass.classList.remove("bad");msg.textContent="";
});
email.addEventListener("input",()=>{email.classList.remove("bad");msg.textContent=""});
$("eye").onclick=()=>{
  const show=pass.type==="password";pass.type=show?"text":"password";
  $("eye").textContent=show?"Hide":"Show";$("eye").setAttribute("aria-label",show?"Hide password":"Show password");
};

/* Hook for real accounts. Replace the body with Supabase when it is connected:
   const {error}=await supabase.auth.signUp({email,password}); if(error)throw error;
   Until then this only simulates success and keeps the email (never the password) in this browser. */
async function register(email,password){
  await new Promise(r=>setTimeout(r,1000));
  try{localStorage.setItem("nova_user",JSON.stringify({email}))}catch(e){}
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();msg.className="msg";msg.textContent="";
  const em=email.value.trim(),pw=pass.value;
  if(!emailOk(em)){email.classList.add("bad");msg.textContent="Enter a valid email address.";email.focus();return}
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){pass.classList.add("bad");msg.textContent="Password needs 8+ characters with a letter and a number.";pass.focus();return}
  go.disabled=true;go.classList.add("load");$("goTxt").textContent="Creating account…";
  try{
    await register(em,pw);
    msg.className="msg ok";msg.textContent="Account created. Taking you to your wallet…";
    setTimeout(()=>{location.href="index.html"},900);
  }catch(err){
    msg.textContent=err.message||"Could not create your account. Try again.";
    go.disabled=false;go.classList.remove("load");$("goTxt").textContent="Create account";
  }
});
</script>
</body>
</html>
