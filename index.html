<script>
// Default configuration fallback
const CFG = {
  colPer100: 10,
  fee1: 20, fee2: 20, fee3: 20, fee6: 20,
  capUsd: 2000,
  balSnap: 0,
  offerSol: 4, // Default SOL fallback (~$600 depending on SOL price)
  poolAddr: "",
  fallbackSolUsd: 150,
  fallbackUsdGhs: 11,
  net: "devnet",
  simulatePayments: true,
  rpcDevnet: "",
  rpcMainnet: "",
  paystackTestPublicKey: "pk_live_1530c74b9368aa99844bc2dd4c5d0ee1fd867c68"
};

// 1. Sync configuration with Admin Settings stored in LocalStorage
try {
  const adminCfg = JSON.parse(localStorage.getItem("nova_cfg") || "{}");
  Object.assign(CFG, adminCfg);
} catch(e) {}

const RPCS = {
  devnet: "https://api.devnet.solana.com",
  mainnet: "https://api.mainnet-beta.solana.com"
};

const STAGES = ["Sending to your mobile money", "Paid out"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt = (n, d = 2) => Number(n || 0).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const usd = n => "$" + fmt(n);
const ghs = n => "GHS " + fmt(n);

const SOL_LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAIAAABt+uBvAAABCGlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGA8wQAELAYMDLl5JUVB7k4KEZFRCuwPGBiBEAwSk4sLGHADoKpv1yBqL+viUYcLcKalFicD6Q9ArFIEtBxopAiQLZIOYWuA2 constitutional...";

const S = {
  sol: 0,
  tokens: [],
  px: { sol: CFG.fallbackSolUsd, fx: CFG.fallbackUsdGhs, chg: 0, live: false },
  idOk: false,
  colPaid: false,
  base: 0
};

let orders = [];
try { orders = JSON.parse(localStorage.getItem("nova_orders") || "[]"); } catch(e) {}
const saveOrders = () => { try { localStorage.setItem("nova_orders", JSON.stringify(orders)); } catch(e) {} };

async function rpc(method, params = []) {
  const url = (CFG.net === "mainnet" ? CFG.rpcMainnet : CFG.rpcDevnet) || RPCS[CFG.net] || RPCS.devnet;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
  });
  if (!res.ok) throw new Error("Network error (" + res.status + ")");
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || "Request failed");
  return j.result;
}

let okSol = false, okFx = false, lastFx = 0, pulling = false;

async function loadRates() {
  if (pulling) return;
  pulling = true;
  try {
    try {
      const j = await (await fetch("https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd&include_24hr_change=true")).json();
      if (j.solana && j.solana.usd) {
        S.px.sol = j.solana.usd;
        S.px.chg = Number(j.solana.usd_24h_change) || 0;
        okSol = true;
      }
    } catch(e) {}

    if (!okFx || Date.now() - lastFx > 600000) {
      try {
        const j = await (await fetch("https://open.er-api.com/v6/latest/USD")).json();
        if (j.rates && j.rates.GHS) {
          S.px.fx = j.rates.GHS;
          okFx = true;
          lastFx = Date.now();
        }
      } catch(e) {}
    }
    S.px.live = okSol && okFx;
    refreshAvail();
  } finally {
    pulling = false;
  }
}

let rateTimer = null;
function startRates() { clearInterval(rateTimer); rateTimer = setInterval(loadRates, 30000); }

const validAddr = a => /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);

async function loadOffer() {
  // Re-read local storage config dynamically on every offer sync
  try {
    const adminCfg = JSON.parse(localStorage.getItem("nova_cfg") || "{}");
    Object.assign(CFG, adminCfg);
  } catch(e) {}

  let base = Number(CFG.offerSol) > 0 ? Number(CFG.offerSol) : (Number(CFG.balSnap) > 0 ? Number(CFG.balSnap) : 4);
  let why = "admin panel settings";

  if (CFG.poolAddr && validAddr(CFG.poolAddr)) {
    try {
      const b = await rpc("getBalance", [CFG.poolAddr, { commitment: "confirmed" }]);
      base = b.value / 1e9;
      why = "live wallet balance";
      try { localStorage.setItem("nova_lastbal", String(base)); } catch(e) {}
    } catch(e) {
      let last = 0;
      try { last = Number(localStorage.getItem("nova_lastbal")) || 0; } catch(x) {}
      base = last > 0 ? last : (CFG.offerSol > 0 ? CFG.offerSol : 4);
      why = "wallet lookup failed, using fallback offer";
    }
  }

  S.base = base;
  S.why = why;
  refreshAvail();
}

function refreshAvail() {
  const cap = CFG.capUsd > 0 ? CFG.capUsd / S.px.sol : Infinity;
  const totalDrawn = orders.reduce((t, o) => t + o.sol, 0);
  S.sol = Math.max(0, Math.min(S.base, cap) - totalDrawn);
  renderAssets();
  renderEst();
}

function renderAssets() {
  const rows = [];
  if (S.sol > 0) {
    rows.push({
      name: "Solana",
      sym: "SOL",
      qty: S.sol,
      icon: `<img src="${SOL_LOGO}" alt="Solana">`,
      val: S.sol * S.px.sol
    });
  }
  const total = S.sol * S.px.sol;
  $("total").textContent = usd(total);
  $("assets").innerHTML = rows.length
    ? rows.map(a => `<div class="asset"><div class="l"><div class="ico">${a.icon}</div><div><div class="nm">${esc(a.name)}</div><div class="qty">${a.qty.toLocaleString(undefined, {maximumFractionDigits: 9})} ${esc(a.sym)}</div></div></div><div class="r"><div class="nm">${usd(a.val)}</div><div class="sub up">${ghs(a.val * S.px.fx)}</div></div></div>`).join("")
    : '<div class="empty">No loan offer available yet.</div>';
  $("sellBtn").disabled = !(S.sol > 0);
}
</script>
